# Tests every push and pull request; builds deskhome-<version>.plasmoid and attaches it to
# the GitHub release when a version tag is pushed. A release is only built if the tests pass.
#
# Normal use: bump "Version" in metadata.json, commit, then push an annotated tag
#   git tag -a v1.1.0 -m "What changed"
#   git push origin main v1.1.0
# The tag message becomes the release notes.
#
# Manual run (Actions tab → Release → Run workflow): builds any existing tag;
# with "publish" unchecked it only produces a downloadable test artifact.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.0.0'
        required: true
      publish:
        description: 'Upload the package to the GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch has current Plasma 6 / KDE Frameworks packages, like the target desktops
    container: archlinux:latest
    steps:
      - name: Install Qt and KDE QML modules
        run: |
          pacman -Syu --noconfirm --needed git python ttf-dejavu kiconthemes qt6-declarative qt6-websockets \
            kirigami kcmutils libplasma plasma5support ksvg kdeclarative kitemmodels knotifications

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Run tests
        env:
          DESKHOME_TEST_OUT: test-output
        run: tests/run.sh

      - name: Keep test logs and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output

  # Same tests on an older Plasma (Debian 13: Plasma 6.3, Qt 6.8), so "Plasma 6" in the store
  # description holds for distributions that are not on the latest release
  test-debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Qt and KDE QML modules
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git python3 fonts-dejavu-core qml-qt6 qt6-declarative-dev-tools \
            qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-effects qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtqml-models \
            qml6-module-qtcore qml6-module-qtwebsockets qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils \
            qml6-module-org-kde-ksvg qml6-module-org-kde-kquickcontrols qml6-module-org-kde-kitemmodels \
            qml6-module-org-kde-notifications qml6-module-org-kde-iconthemes \
            qml6-module-org-kde-plasma-plasma5support libplasma6 plasma-desktoptheme

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Run tests
        env:
          DESKHOME_TEST_OUT: test-output
          # Plasma 6.3 provides org.kde.plasma.plasmoid and the global i18nc only inside plasmashell
          DESKHOME_TEST_IGNORE: 'kquickcontrols/ColorButton.qml:[0-9]+: ReferenceError: i18nc is not defined'
        run: QML_IMPORT_PATH="$PWD/tests/compat" tests/run.sh

      - name: Keep test logs and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-debian
          path: test-output

  release:
    needs: [test, test-debian]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches metadata.json
        id: version
        run: |
          VERSION=$(jq -r .KPlugin.Version metadata.json)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::metadata.json has version $VERSION, but the tag is $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plasmoid
        env:
          FILE: deskhome-${{ steps.version.outputs.version }}.plasmoid
        run: |
          git archive --format=zip -o "$FILE" HEAD metadata.json LICENSE contents
          unzip -l "$FILE" | tail -1
          md5sum "$FILE"
          sha256sum "$FILE"

      - name: Keep package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskhome-${{ steps.version.outputs.version }}
          path: deskhome-${{ steps.version.outputs.version }}.plasmoid

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE="deskhome-$VERSION.plasmoid"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "DeskHome $VERSION" --notes-from-tag
          fi
